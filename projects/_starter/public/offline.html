<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#3f348f" />
    <title>Client Name: no internet</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px; background: #f7f7fb; color: #2a2a3f; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
      main { width: 100%; max-width: 360px; text-align: center; }
      img { width: 84px; height: 84px; border-radius: 22px; box-shadow: 0 18px 40px -12px rgba(63, 52, 143, 0.28); }
      .brand { margin: 14px 0 0; font-size: 14px; font-weight: 600; color: #71718c; }
      h1 { margin: 10px 0 8px; font-size: 24px; color: #1a1a2c; }
      p { margin: 0 0 24px; font-size: 16px; line-height: 1.5; color: #55556e; }
      button { width: 100%; padding: 14px 18px; border: 0; border-radius: 14px; background: #3f348f; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
      button:active { transform: scale(0.98); }
    </style>
  </head>
  <body>
    <main>
      <img src="/brand/app-192.png" alt="" />
      <p class="brand">Client Name</p>
      <h1>No internet</h1>
      <p>This screen needs a connection. Check your mobile data or Wi-Fi and try again. Nothing you saved is lost.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
    <script>
      window.addEventListener('online', function () { location.reload(); });
    </script>
  </body>
</html>
